name: Compilar Lampiao Hidden

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extrair projeto
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q lampiao-hidden-do-zero.zip -d projeto

          echo "Arquivos encontrados:"
          find projeto -maxdepth 4 -type f

      - name: Encontrar projeto
        run: |
          PROJECT_DIR=$(find projeto -name build.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          echo "Projeto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corrigir build.gradle
        run: |
          cd "$PROJECT_DIR"

          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom-remap' version '1.17.13'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              maven {
                  url = 'https://maven.fabricmc.net/'
              }

              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

      - name: Corrigir gradle.properties
        run: |
          cd "$PROJECT_DIR"

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G

          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6

          loader_version=0.19.3
          fabric_version=0.141.6+1.21.11

          mod_version=1.0.0
          maven_group=com.lampiaohidden
          archives_base_name=lampiao-hidden
          EOF

      - name: Corrigir codigo Java
        run: |
          cd "$PROJECT_DIR"

          mkdir -p src/main/java/com/lampiaohidden

          cat > src/main/java/com/lampiaohidden/LampiaoHidden.java <<'EOF'
          package com.lampiaohidden;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.minecraft.component.DataComponentTypes;
          import net.minecraft.component.type.NbtComponent;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.entity.effect.StatusEffects;
          import net.minecraft.item.ItemStack;
          import net.minecraft
                     
